<!DOCTYPE html>
<html lang="🌫️">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2077.CLOUD</title>
    <style>
        :root {
            --cyan: #00f3ff;
            --cyan-glow: rgba(0, 243, 255, 0.6);
            --dark-bg: #030508;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: drop-shadow(0 0 10px var(--cyan-glow));
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            z-index: 5;
            pointer-events: none;
        }

        .ui-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .cyber-btn {
            pointer-events: auto;
            position: relative;
            padding: 24px 70px;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--cyan);
            background: rgba(0, 15, 20, 0.85);
            border: none;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 8px;
            clip-path: polygon(
                20px 0, 100% 0, 
                100% calc(100% - 20px), calc(100% - 20px) 100%, 
                0 100%, 0 20px
            );
            transition: all 0.2s linear;
            backdrop-filter: blur(5px);
        }

        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid var(--cyan);
            clip-path: polygon(
                20px 0, 100% 0, 
                100% calc(100% - 20px), calc(100% - 20px) 100%, 
                0 100%, 0 20px
            );
            z-index: -1;
        }

        .cyber-btn::after {
            content: 'SYS.LOGIN';
            position: absolute;
            top: -14px;
            right: 10px;
            font-size: 0.6rem;
            color: #000;
            background: var(--cyan);
            padding: 2px 6px;
            letter-spacing: 2px;
        }

        .btn-glitch-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--cyan);
            opacity: 0;
            z-index: -2;
            transition: opacity 0.3s ease;
        }

        .cyber-btn:hover {
            color: #000;
            text-shadow: none;
            transform: scale(1.05);
            box-shadow: 0 0 40px var(--cyan-glow);
        }

        .cyber-btn:hover .btn-glitch-layer {
            opacity: 1;
            animation: glitch-anim 0.3s infinite;
        }

        @keyframes glitch-anim {
            0% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); transform: translate(-2px, 2px); }
            20% { clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%); transform: translate(2px, -2px); }
            40% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); transform: translate(-2px, -2px); }
            60% { clip-path: polygon(0 40%, 100% 40%, 100% 45%, 0 45%); transform: translate(2px, 2px); }
            80% { clip-path: polygon(0 80%, 100% 80%, 100% 85%, 0 85%); transform: translate(-2px, -2px); }
            100% { clip-path: polygon(0 60%, 100% 60%, 100% 65%, 0 65%); transform: translate(2px, 2px); }
        }

        .corner-marks {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .corner-marks::before, .corner-marks::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: var(--cyan);
            border-style: solid;
            opacity: 0.5;
        }

        .corner-marks::before {
            top: 20px; left: 20px;
            border-width: 3px 0 0 3px;
        }

        .corner-marks::after {
            bottom: 20px; right: 20px;
            border-width: 0 3px 3px 0;
        }

    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="corner-marks"></div>
    
    <div id="canvas-container">
        <canvas id="hexCloud"></canvas>
    </div>
    
    <div class="ui-container">
        <a href="https://login.2077.cloud" class="cyber-btn">
            LOGIN
            <div class="btn-glitch-layer"></div>
        </a>
    </div>

    <script>
        const canvas = document.getElementById('hexCloud');
        const ctx = canvas.getContext('2d');
        let w, h;
        const hexChars = '0123456789ABCDEF';
        const particles = [];
        const particleCount = 1500;
        
        let mouseX = 0;
        let mouseY = 0;
        let targetRotX = 0;
        let targetRotY = 0;
        let currentRotX = 0;
        let currentRotY = 0;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function isInsideCloud(x, y, z) {
            const r1 = 120;
            const d1 = x*x + y*y + z*z;
            if (d1 < r1*r1) return true;

            const r2 = 85;
            const cx2 = -90, cy2 = 25, cz2 = 0;
            const d2 = (x-cx2)*(x-cx2) + (y-cy2)*(y-cy2) + (z-cz2)*(z-cz2);
            if (d2 < r2*r2) return true;

            const r3 = 95;
            const cx3 = 90, cy3 = 15, cz3 = 0;
            const d3 = (x-cx3)*(x-cx3) + (y-cy3)*(y-cy3) + (z-cz3)*(z-cz3);
            if (d3 < r3*r3) return true;

            const r4 = 65;
            const cx4 = -150, cy4 = 55, cz4 = 0;
            const d4 = (x-cx4)*(x-cx4) + (y-cy4)*(y-cy4) + (z-cz4)*(z-cz4);
            if (d4 < r4*r4) return true;

            const r5 = 70;
            const cx5 = 150, cy5 = 50, cz5 = 0;
            const d5 = (x-cx5)*(x-cx5) + (y-cy5)*(y-cy5) + (z-cz5)*(z-cz5);
            if (d5 < r5*r5) return true;

            return false;
        }

        function generateCloud() {
            let attempts = 0;
            while(particles.length < particleCount && attempts < 50000) {
                const px = (Math.random() - 0.5) * 450;
                const py = (Math.random() - 0.5) * 300;
                const pz = (Math.random() - 0.5) * 200;

                if (py > 90) {
                    attempts++;
                    continue; 
                }

                if (isInsideCloud(px, py, pz)) {
                    particles.push({
                        origX: px * 1.5,
                        origY: py * 1.5,
                        origZ: pz * 1.5,
                        char: hexChars[Math.floor(Math.random() * 16)],
                        speed: Math.random() * 0.02,
                        phase: Math.random() * Math.PI * 2
                    });
                }
                attempts++;
            }
        }

        let globalTime = 0;

        function render() {
            ctx.clearRect(0, 0, w, h);
            
            globalTime += 0.01;

            currentRotX += (targetRotX - currentRotX) * 0.05;
            currentRotY += (targetRotY - currentRotY) * 0.05;

            const baseRotY = globalTime * 0.2;
            const finalRotY = baseRotY + currentRotY;
            const finalRotX = currentRotX;

            const cosY = Math.cos(finalRotY);
            const sinY = Math.sin(finalRotY);
            const cosX = Math.cos(finalRotX);
            const sinX = Math.sin(finalRotX);

            const renderList = [];

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                
                const hoverOffset = Math.sin(globalTime * 2 + p.phase) * 5;
                const yWithHover = p.origY + hoverOffset;

                let tx = p.origX * cosY - p.origZ * sinY;
                let tz = p.origZ * cosY + p.origX * sinY;
                
                let ty = yWithHover * cosX - tz * sinX;
                tz = tz * cosX + yWithHover * sinX;

                renderList.push({
                    x: tx,
                    y: ty,
                    z: tz,
                    ref: p
                });
            }

            renderList.sort((a, b) => b.z - a.z);

            const cx = w / 2;
            const cy = h / 2 - 40; 
            const fov = 800;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = 0; i < renderList.length; i++) {
                const p = renderList[i];
                const scale = fov / (fov + p.z);
                
                if (scale < 0) continue;

                const x2d = cx + p.x * scale;
                const y2d = cy + p.y * scale;

                const zNormalized = (p.z + 300) / 600; 
                let alpha = 1 - zNormalized;
                if (alpha < 0.1) alpha = 0.1;
                if (alpha > 1) alpha = 1;

                if (Math.random() < 0.01) {
                    p.ref.char = hexChars[Math.floor(Math.random() * 16)];
                }

                ctx.fillStyle = `rgba(0, 243, 255, ${alpha})`;
                const fontSize = Math.max(1, 16 * scale);
                ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
                
                if (alpha > 0.6) {
                    ctx.shadowBlur = 10 * scale;
                    ctx.shadowColor = '#00f3ff';
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.fillText(p.ref.char, x2d, y2d);
            }

            requestAnimationFrame(render);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = (e.clientY / window.innerHeight) * 2 - 1;
            
            targetRotY = mouseX * 0.5;
            targetRotX = mouseY * 0.5;
        });

        resize();
        generateCloud();
        render();
    </script>
</body>
</html>

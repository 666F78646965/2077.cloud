async function listFiles(){
 try{const r=await fetch('files.json',{cache:'no-store'});if(r.ok){const a=await r.json();if(Array.isArray(a))return a.map(String)}}catch(e){}
 const h=location.hostname,pr=new URLSearchParams(location.search).get('gh'),ps=location.pathname.split('/').filter(Boolean),c=[];
 if(ps.length&&/\./.test(ps[ps.length-1]))ps.pop();
 if(pr){const q=pr.split('/');c.push([q[0],q[1],q.slice(2).join('/')])}
 else if(h.endsWith('.github.io')){const o=h.split('.')[0];if(ps.length)c.push([o,ps[0],ps.slice(1).join('/')]);c.push([o,h,ps.join('/')])}
 for(const[o,rp,sub]of c){try{const r=await fetch('https://api.github.com/repos/'+o+'/'+rp+'/contents/'+sub);if(r.ok){const a=await r.json();if(Array.isArray(a))return a.filter(x=>x.type=='file').map(x=>x.name)}}catch(e){}}
 return[]}
